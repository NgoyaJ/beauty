function nextWD(dow){const now=new Date(),d=(dow-now.getDay()+7)%7||7;const next=new Date(now);next.setDate(now.getDate()+d);return{days:d,iso:next.toISOString().slice(0,10)}}
function calcPhase(cm){if(cm<8)return{n:1,label:"Phase 1",desc:"Short TWA & Finger Coils",styles:"Finger Coils · Gestretchter Afro · Mini Twists"};if(cm<12)return{n:2,label:"Phase 2",desc:"Two-Strand Twists",styles:"Two-Strand Twists · Twist-Out · Flat Twists"};if(cm<15)return{n:3,label:"Phase 3",desc:"Mehr Vielfalt",styles:"Mini Twists · Puffs · Crown Styles · Braid-Out"};return{n:4,label:"Phase 4",desc:"Volle Rotation",styles:"Alle Styles + kontrolliertes Crochet"}}
function buildPack(start,end,dow){const s=new Date(start+"T12:00"),e=new Date(end+"T12:00");if(e<s)return null;const days=Math.round((e-s)/864e5)+1,wds=[];for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))if(d.getDay()===dow)wds.push(d.toISOString().slice(0,10));return{days,wds,items:[...PACK_A.map(i=>({cat:"Immer",i})),...(wds.length>0?PACK_W.map(i=>({cat:"Wash Day",i})):[]),...(days>4?PACK_R.map(i=>({cat:"Refresh",i})):[]),...(days>7?PACK_L.map(i=>({cat:"Extras",i})):[])]}}
function getDue(entries){const now=new Date(),due=[];const lC=entries.find(e=>e.type==="check"),lM=entries.find(e=>e.type==="measure");if(!lC){due.push({text:"Ersten Check-in machen",hint:"Log → + Monatlicher Check",lvl:"info"});}else{const d=Math.round((now-new Date(lC.date+"T12:00"))/864e5);if(d>=28)due.push({text:`Check-in fällig (vor ${d} Tagen)`,hint:"Log → + Monatlicher Check",lvl:d>42?"urgent":"warn"});}if(!lM){due.push({text:"Erste Messung: nach Woche 12",hint:"Log → + Messung",lvl:"info"});}else{const d=Math.round((now-new Date(lM.date+"T12:00"))/864e5);if(d>=84)due.push({text:`Längenmessung fällig (vor ${Math.round(d/7)} Wochen)`,hint:"Log → + Messung",lvl:d>100?"urgent":"warn"});}return due;}

const MNAMES=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function Cal({value, onSelect}){
  const E=React.createElement;
  const initD=value?new Date(value+"T12:00"):new Date();
  const[vy,setVy]=useState(initD.getFullYear());
  const[vm,setVm]=useState(initD.getMonth());
  // Sync view when value prop changes (e.g. switching between start/end picker)
  useEffect(()=>{if(value){const d=new Date(value+"T12:00");setVy(d.getFullYear());setVm(d.getMonth());}else{const n=new Date();setVy(n.getFullYear());setVm(n.getMonth());}},[value]);
  const prev=()=>{if(vm===0){setVm(11);setVy(vy-1);}else setVm(vm-1);};
  const next=()=>{if(vm===11){setVm(0);setVy(vy+1);}else setVm(vm+1);};
  const fdow=(new Date(vy,vm,1).getDay()+6)%7; // Monday=0
  const dim=new Date(vy,vm+1,0).getDate();
  const cells=[];
  for(let i=0;i<fdow;i++)cells.push(null);
  for(let d=1;d<=dim;d++)cells.push(d);
  const td=toDay();
  return E("div",{style:{borderTop:"1.5px solid var(--brd)",paddingTop:12,marginTop:10}},
    // Month/year header
    E("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
      E("button",{onClick:prev,style:{background:"none",border:"none",cursor:"pointer",fontSize:"24px",color:"var(--acc)",padding:"2px 14px",lineHeight:1,minHeight:44}},"‹"),
      E("span",{style:{fontSize:"15px",fontWeight:700,color:"var(--tp)"}},`${MNAMES[vm]} ${vy}`),
      E("button",{onClick:next,style:{background:"none",border:"none",cursor:"pointer",fontSize:"24px",color:"var(--acc)",padding:"2px 14px",lineHeight:1,minHeight:44}},"›")),
    // Day name headers
    E("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:4}},
      DNAMES.map(d=>E("div",{key:d,style:{textAlign:"center",fontSize:"12px",fontWeight:600,color:"var(--tm)",padding:"3px 0"}},d))),
    // Day grid — tap any day to select AND auto-close (handled by parent via onSelect)
    E("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}},
      cells.map((d,i)=>{
        if(!d)return E("div",{key:`e${i}`});
        const iso=`${vy}-${String(vm+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const isSel=iso===value,isToday=iso===td;
        return E("button",{key:iso,onClick:()=>onSelect(iso),style:{
          minHeight:"42px",border:"none",borderRadius:"9px",cursor:"pointer",
          fontSize:"15px",fontFamily:"inherit",fontWeight:isSel||isToday?700:400,
          background:isSel?"var(--acc)":isToday?"var(--bgacc)":"transparent",
          color:isSel?"var(--onacc)":isToday?"var(--acc)":"var(--tp)",
        }},d);
      })));
}

        E("div",null,E("div",{style:{fontSize:"10px",fontWeight:600,color:"var(--tm)",letterSpacing:".09em",textTransform:"uppercase"}},"🌿 Beauty System"),E("div",{style:{fontSize:"20px",fontWeight:700,color:"var(--tp)"}},"Mein Plan")),

      E("div",{style:{display:"flex"}},TABS.map(t=>E("button",{key:t.id,onClick:()=>setTab(t.id),style:{flex:1,padding:"8px 2px 9px",background:"none",border:"none",borderBottom:tab===t.id?"3px solid var(--acc)":"3px solid transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}},
